<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />

    <style>
      body {
        background-color: #0b1f33;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      
      .card-box {
        width: 100%;
        max-width: 420px;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      
      .title {
        text-align: center;
        font-weight: 800;
        margin-bottom: 20px;
        color: #0b1f33;
      }
      
      .btn-custom {
        background-color: #00506e !important;
        border-color: #00374e !important;
        font-weight: 700;
      }
      
      .btn-custom:hover {
        opacity: 0.9;
      }
      
      .footer-link {
        text-align: center;
        margin-top: 15px;
      }
      
      .errorlist {
        color: red;
        font-size: 14px;
        margin-bottom: 10px;
        list-style: none;
        padding-left: 0;
      }
    </style>
  </head>

  <body>
    <div class="card-box">
      <h2 class="title">Connexion</h2>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <hr />
        <button class="btn btn-custom btn-block text-white" type="submit">Se connecter</button>
      </form>
      <br/>
      <div class="text-center mb-3">
        <a href="{% url 'fc_login' %}"><img src="https://partenaires.franceconnect.gouv.fr/images/fc_bouton_v2.png" alt="S'identifier avec FranceConnect" style="height:55px; cursor:pointer;" /></a>
      </div>

      <div class="footer-link">
        Pas de compte ?
        <a href="{% url 'signup' %}">Créer un compte</a>
      </div>
    </div>
  </body>
</html>
